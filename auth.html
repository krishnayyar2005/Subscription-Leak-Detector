<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access | Leak Detector</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- LIGHT NOTHING MINIMALISM --- */
        body { 
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 80px 20px;
            min-height: 100vh;
            
            /* Luminous light gradient background (like the headphone image) */
            background: radial-gradient(circle at center, #ffffff 0%, #eaebed 100%);
            color: #000000;
            
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* --- THE FIXED OVERLAY DOT WINDOW (Dark Dots) --- */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; 
            pointer-events: none; 
            
            /* Dark, widely spaced dots for the light theme */
            background-image: radial-gradient(circle, rgba(0, 0, 0, 0.15) 1.5px, transparent 1.5px);
            background-size: 160px 160px;
            background-position: 80px 80px; 
        }

        .auth-container {
            max-width: 450px;
            width: 100%;
            z-index: 1; 
        }

        /* --- N-DOT MATRIX HEADINGS --- */
        h2 {
            font-family: 'Doto', sans-serif;
            text-align: center;
            font-size: 2.2rem;
            letter-spacing: 0.05em;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 40px;
            letter-spacing: 0.05em;
        }

        /* --- CLEAN WHITE CARDS --- */
        .card { 
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 45px 40px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        /* A tiny subtle accent line at the top */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: #000000;
        }

        /* --- MINIMALIST FORMS --- */
        .form-group { margin-bottom: 24px; }
        
        label { 
            display: block; 
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        input { 
            font-family: 'Roboto', sans-serif;
            width: 100%; 
            padding: 16px 20px; 
            box-sizing: border-box; 
            
            /* Light grey inputs */
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            color: #000000;
            font-size: 1rem;
            outline: none;
            
            transition: all 0.2s ease;
        }

        input::placeholder { color: #999999; }
        
        /* Stark black border on focus */
        input:focus {
            border-color: #000000;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        /* --- SOLID BLACK BUTTONS --- */
        button { 
            font-family: 'Roboto', sans-serif;
            width: 100%;
            padding: 18px; 
            margin-top: 15px; 
            
            background: #000000;
            color: #ffffff; 
            border: 1px solid #000000;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 0.15em;
            
            transition: all 0.2s ease;
        }

        button:hover { 
            background: #ffffff;
            color: #000000;
        }

        /* --- TOGGLE TEXT --- */
        .toggle-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #666666;
        }

        .toggle-text a {
            color: #000000;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dotted #000000;
            margin-left: 5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .toggle-text a:hover {
            color: #ff0033; /* Nothing Red accent on hover */
            border-bottom-color: #ff0033;
        }

        /* Hide the signup form initially */
        #signupSection {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="card">
            <h2>System Login</h2>
            <div class="subtitle">Enter your credentials to access the leak detector.</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="user@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit">Authenticate</button>
            </form>

            <div class="toggle-text">
                Unregistered? <a onclick="toggleAuth('signup')">Create an account</a>
            </div>
        </div>

        <!-- SIGNUP SECTION -->
        <div id="signupSection" class="card">
            <h2>Initialize User</h2>
            <div class="subtitle">Register a new profile to begin tracking.</div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="user@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required>
                </div>
                <button type="submit">Register Data</button>
            </form>

            <div class="toggle-text">
                Already active? <a onclick="toggleAuth('login')">Access system</a>
            </div>
        </div>

    </div>

    <!-- JavaScript to toggle between Login and Signup -->
    <script>
        function toggleAuth(view) {
            const loginSection = document.getElementById('loginSection');
            const signupSection = document.getElementById('signupSection');
            
            if (view === 'signup') {
                loginSection.style.display = 'none';
                signupSection.style.display = 'block';
            } else {
                loginSection.style.display = 'block';
                signupSection.style.display = 'none';
            }
        }

        // Handle Login Submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // In a real app, you would verify the email/password here.
            // For now, we just redirect straight to the main app!
            window.location.href = 'index.html';
        });

        // Handle Signup Submission
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // In a real app, you would save the new user to a database here.
            // For now, we redirect them straight to the main app!
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
