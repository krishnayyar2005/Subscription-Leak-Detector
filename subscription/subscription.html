<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSARA - Subscriptions</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../dashboard 2/css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== Top Navigation Bar ===== -->
    <nav class="topnav" id="topnav">
        <div class="topnav__inner">
            <!-- Brand -->
            <div class="topnav__left">
                <a href="../index.html" class="topnav__brand">ESSARA</a>
                <!-- Desktop Nav Links -->
                <div class="topnav__links" id="nav-links">
                    <a href="../dashboard 2/dashboard.html" class="topnav__link">Overview</a>
                    <a href="subscription.html" class="topnav__link topnav__link--active">Subscriptions</a>
                    <a href="../overlaps/index.html" class="topnav__link">Overlaps</a>
                    <a href="../reports/reports.html" class="topnav__link">Reports</a>
                    <a href="../budget.html" class="topnav__link">Budget</a>
                    <a href="../calendar.html" class="topnav__link">Calendar</a>
                </div>
            </div>
            <!-- Actions -->
            <div class="topnav__actions">
                <select class="currency-select" id="currency-select">
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="INR">INR (₹)</option>
                </select>
                <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
                <div class="profile-menu-container" id="profile-menu-container">
                    <div class="avatar" id="profile-icon" role="button" tabindex="0">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <div class="profile-dropdown" id="profile-dropdown">
                        <div class="profile-dropdown__header">
                            <span class="profile-dropdown__name" id="user-display-name"></span>
                            <span class="profile-dropdown__email" id="user-display-email"></span>
                        </div>
                        <div class="profile-dropdown__divider"></div>
                        <button class="profile-dropdown__item profile-dropdown__item--danger" id="logout-btn">
                            <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
                            Log out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <main class="main-content">
        <div class="page-layout--sidebar">
            
            <!-- Sidebar: Form -->
            <aside class="sidebar">
                <div class="card">
                    <h2 class="card__title card__title--large">Add Subscription</h2>
                    <form class="subscription-form" id="subscription-form">
                        <div class="form-group">
                            <label class="form-label">Name</label>
                            <input class="form-input" type="text" id="sub-name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <div class="select-wrapper">
                                <select class="form-select" id="sub-category" required>
                                    <option>Music</option>
                                    <option>Video</option>
                                    <option>Gaming</option>
                                    <option>Cloud Storage</option>
                                    <option>Fitness</option>
                                    <option>News</option>
                                    <option>Productivity</option>
                                    <option>Food</option>
                                    <option>Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group form-group--half">
                                <label class="form-label">Cost</label>
                                <div class="input-with-icon">
                                    <span class="input-icon" id="cost-currency-symbol">$</span>
                                    <input class="form-input form-input--mono form-input--pl" type="number" step="0.01" min="0.01" id="sub-cost" required>
                                </div>
                            </div>
                            <div class="form-group form-group--half">
                                <label class="form-label">Billing Cycle</label>
                                <div class="select-wrapper">
                                    <select class="form-select" id="sub-cycle" required>
                                        <option>Monthly</option>
                                        <option>Yearly</option>
                                        <option>Weekly</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Renewal Date</label>
                            <input class="form-input" type="date" id="sub-date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Payment Method</label>
                            <div class="select-wrapper">
                                <select class="form-select" id="payment-method" required>
                                    <option value="cc">Credit Card</option>
                                    <option value="dc">Debit Card</option>
                                    <option value="upi">UPI</option>
                                    <option value="paypal">PayPal</option>
                                    <option value="net">Net Banking</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group" id="card-digits-container">
                            <label class="form-label">Card Last 4 Digits</label>
                            <input class="form-input form-input--mono" type="text" id="card-digits" placeholder="1234" maxlength="4" pattern="\d{4}">
                        </div>
                        <div class="form-actions">
                            <button class="btn btn--primary btn--full" type="submit">Add Subscription</button>
                        </div>
                    </form>
                </div>
            </aside>

            <!-- Main Content Area: List -->
            <section class="main-column">
                
                <!-- Controls -->
                <div class="list-controls">
                    <div class="search-box">
                        <span class="material-symbols-outlined search-icon">search</span>
                        <input class="form-input form-input--search" type="text" placeholder="Search subscriptions...">
                    </div>
                    <div class="filter-chips">
                        <button class="chip chip--active">All</button>
                        <button class="chip">Video</button>
                        <button class="chip">Music</button>
                    </div>
                </div>

                <!-- List Table -->
                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Subscription</th>
                                <th>Cycle</th>
                                <th>Next Renewal</th>
                                <th class="text-right">Monthly Cost</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subscriptions-list-container">
                            <tr>
                                <td colspan="5" class="text-center font-body text-on-surface-variant p-4">No subscriptions added yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>



    <script src="../js/script.js"></script>
    <script src="../dashboard 2/js/script.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const trigger = document.getElementById("profile-icon");
            const dropdown = document.getElementById("profile-dropdown");
            if (trigger && dropdown) {
                // Populate user info
                try {
                    const session = JSON.parse(localStorage.getItem('essara_session'));
                    if (session) {
                        document.getElementById('user-display-name').textContent = session.name;
                        document.getElementById('user-display-email').textContent = session.email;
                    }
                } catch(e) {}

                trigger.addEventListener("click", (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle("open");
                });
                document.addEventListener("click", (e) => {
                    if (!dropdown.contains(e.target) && !trigger.contains(e.target)) {
                        dropdown.classList.remove("open");
                    }
                });
            }
            const logoutBtn = document.getElementById("logout-btn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    localStorage.removeItem('essara_session');
                    window.location.href = '../login.html';
                });
            }
        });
    </script>
</body>
</html>
