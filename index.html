<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Overlap Detector</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- TRUE NOTHING MINIMALISM --- */
        body { 
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 80px 20px;
            min-height: 100vh;
            background: radial-gradient(circle at center, #111111 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
        }

        /* --- THE FIXED OVERLAY DOT WINDOW --- */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; 
            pointer-events: none; 
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.85) 1.5px, transparent 1.5px);
            background-size: 160px 160px;
            background-position: 80px 80px; 
        }

        .container {
            max-width: 640px;
            width: 100%;
            z-index: 1; 
        }

        /* --- TRUE N-DOT MATRIX HEADINGS --- */
        h2 {
            font-family: 'Doto', sans-serif;
            text-align: center;
            font-size: 2.8rem;
            letter-spacing: 0.05em;
            margin-bottom: 60px;
            text-transform: uppercase;
            font-weight: 700;
        }

        h3 {
            font-family: 'Doto', sans-serif;
            margin-top: 0;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            color: #ffffff;
        }

        /* --- DARK FROSTED CARDS --- */
        .card { 
            background: linear-gradient(145deg, rgba(40, 40, 40, 0.6) 0%, rgba(5, 5, 5, 0.2) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px; 
            margin-bottom: 30px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* --- MINIMALIST FORMS --- */
        .form-group { margin-bottom: 24px; }
        
        label { 
            display: block; 
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        input, select { 
            font-family: 'Roboto', sans-serif;
            width: 100%; 
            padding: 16px 20px; 
            box-sizing: border-box; 
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder { color: #555555; }
        
        select option { 
            background-color: #111111; 
            color: #ffffff; 
        }

        input:focus, select:focus {
            border-color: #ffffff;
            background: rgba(20, 20, 20, 0.6);
        }

        /* --- BRUTALIST BUTTONS --- */
        button { 
            font-family: 'Roboto', sans-serif;
            width: 100%;
            padding: 18px; 
            margin-top: 10px; 
            background: #ffffff;
            color: #000000; 
            border: 1px solid #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }

        button:hover { 
            background: transparent;
            color: #ffffff;
        }

        .btn-danger {
            background: transparent;
            color: #ff3333;
            border: 1px solid rgba(255, 51, 51, 0.4);
            margin-top: 30px;
        }

        .btn-danger:hover {
            border-color: #ff3333;
            background: rgba(255, 51, 51, 0.1);
        }

        /* --- LISTS & ALERTS --- */
        ul { list-style-type: none; padding: 0; margin: 0; }
        
        li {
            background: rgba(0, 0, 0, 0.3);
            padding: 18px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #cccccc;
        }

        .warning li {
            border-left: 2px solid #ff3333;
            background: rgba(255, 51, 51, 0.05);
            color: #ffffff;
        }
        
        .success li {
            border-left: 2px solid #ffffff;
        }

        /* --- FIXED BAR CHART --- */
        .bar-chart { 
            display: flex; 
            height: 36px; /* Thickened so the % text fits beautifully inside */
            margin-top: 30px; 
            border-radius: 8px; 
            overflow: hidden; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bar-segment { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            
            /* Doto Font inside the bar for the percentages */
            font-family: 'Doto', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #000000; /* High contrast against the white/gray fill */
            letter-spacing: 1px;
        }

        #legendList {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        #legendList li {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            font-size: 0.8rem;
            color: #888888;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2> Subscription Leak Detector</h2>

        <!-- Subscription Form -->
        <div class="card">
            <h3>Add Service</h3>
            <form id="subForm">
                <div class="form-group">
                    <label for="subName">Service Name</label>
                    <input type="text" id="subName" placeholder="Spotify, Netflix, etc." required>
                </div>
                <div class="form-group">
                    <label for="subCategory">Category</label>
                    <select id="subCategory" required>
                        <option value="Video">Video Streaming</option>
                        <option value="Music">Music</option>
                        <option value="Software">Software & Cloud</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subCost">Cost (₹)</label>
                    <input type="number" id="subCost" min="1" step="0.01" placeholder="199.00" required>
                </div>
                <div class="form-group">
                    <label for="subCycle">Billing Cycle</label>
                    <select id="subCycle" required>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                        <option value="weekly">Weekly</option>
                    </select>
                </div>
                <button type="submit">Track Data</button>
            </form>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" style="display: none;">
            <div class="card">
                <h3>Overlap Log</h3>
                <ul id="warningsList" class="warning"></ul>
            </div>
            
            <div class="card">
                <h3>Monthly Outflow</h3>
                <!-- The Zeros and the Rupee Symbol are now perfectly formatted -->
                <strong id="totalCost" style="font-family: 'Doto', sans-serif; font-size: 3.5rem; font-weight: 700; color: #ffffff; display: block; margin-top: 15px; font-variant-numeric: slashed-zero;">
                    <span style="font-family: 'Roboto', sans-serif; font-size: 1.8rem; opacity: 0.4; vertical-align: middle; margin-right: 8px;">₹</span>0.00
                </strong>
                
                <div id="chartContainer" class="bar-chart"></div>
                <ul id="legendList"></ul>
            </div>

            <div class="card">
                <h3>Active Log</h3>
                <ul id="subsList"></ul>
                <button class="btn-danger" onclick="clearData()">Wipe System Data</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
