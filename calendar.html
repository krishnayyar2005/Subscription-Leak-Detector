<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSARA - Renewal Calendar</title>
    <meta name="description" content="ESSARA Renewal Calendar — Track your upcoming subscription renewals.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="dashboard 2/css/style.css">
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>

    <!-- ===== Top Navigation Bar ===== -->
    <nav class="topnav" id="topnav">
        <div class="topnav__inner">
            <!-- Brand -->
            <div class="topnav__left">
                <a href="index.html" class="topnav__brand">ESSARA</a>
                <!-- Desktop Nav Links -->
                <div class="topnav__links" id="nav-links">
                    <a href="dashboard 2/dashboard.html" class="topnav__link">Overview</a>
                    <a href="subscription/subscription.html" class="topnav__link">Subscriptions</a>
                    <a href="overlaps/index.html" class="topnav__link">Overlaps</a>
                    <a href="reports/reports.html" class="topnav__link">Reports</a>
                    <a href="budget.html" class="topnav__link">Budget</a>
                    <a href="calendar.html" class="topnav__link topnav__link--active">Calendar</a>
                </div>
            </div>
            <!-- Actions -->
            <div class="topnav__actions">
                <select class="currency-select" id="currency-select">
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="INR">INR (₹)</option>
                </select>
                <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
                <div class="profile-menu-container" id="profile-menu-container">
                    <div class="avatar" id="profile-icon" role="button" tabindex="0">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <div class="profile-dropdown" id="profile-dropdown">
                        <div class="profile-dropdown__header">
                            <span class="profile-dropdown__name" id="user-display-name"></span>
                            <span class="profile-dropdown__email" id="user-display-email"></span>
                        </div>
                        <div class="profile-dropdown__divider"></div>
                        <button class="profile-dropdown__item profile-dropdown__item--danger" id="logout-btn">
                            <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
                            Log out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <main class="main-content" id="view-calendar">
        
        <!-- Page Header -->
        <header class="page-header calendar-header-row">
            <div class="calendar-header-text">
                <h1 class="page-header__title">Renewal Calendar</h1>
                <p class="page-header__subtitle">Track your upcoming subscription renewals.</p>
            </div>
            <div class="calendar-header-controls">
                <button class="icon-btn calendar-nav-btn" id="cal-prev" aria-label="Previous month">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <h2 class="calendar-month-label font-headline" id="cal-month-label">Month Year</h2>
                <button class="icon-btn calendar-nav-btn" id="cal-next" aria-label="Next month">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </header>

        <!-- Calendar Layout Grid -->
        <div class="calendar-layout">
            
            <!-- Left: Calendar Grid -->
            <div class="calendar-grid-wrapper">
                <div class="calendar-grid-header">
                    <div class="calendar-day-header">Sun</div>
                    <div class="calendar-day-header">Mon</div>
                    <div class="calendar-day-header">Tue</div>
                    <div class="calendar-day-header">Wed</div>
                    <div class="calendar-day-header">Thu</div>
                    <div class="calendar-day-header">Fri</div>
                    <div class="calendar-day-header">Sat</div>
                </div>
                <div class="calendar-grid-body" id="calendar-grid">
                    <!-- Days will be dynamically generated here -->
                </div>
            </div>

            <!-- Right: Upcoming Renewals -->
            <aside class="calendar-sidebar">
                <div class="card upcoming-renewals-card">
                    <h2 class="card__title" style="margin-bottom: var(--space-xl);">Upcoming Renewals</h2>
                    
                    <div class="upcoming-renewals-list" id="upcoming-renewals-list">
                        <!-- Upcoming items will be dynamically generated here -->
                    </div>
                </div>
            </aside>
            
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/script.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
