ight:"400"}],"tabular-stat":["32px",{lineHeight:"38px",letterSpacing:"-0.02em",fontWeight:"700"}],"label-sm":["10px",{lineHeight:"14px",letterSpacing:"0.06em",fontWeight:"700"}],"label-md":["12px",{lineHeight:"16px",letterSpacing:"0.04em",fontWeight:"600"}],"body-md":["14px",{lineHeight:"22px",fontWeight:"400"}],"headline-md":["26px",{lineHeight:"32px",letterSpacing:"-0.015em",fontWeight:"600"}],"title-md":["16px",{lineHeight:"24px",fontWeight:"600"}],"headline-sm":["20px",{lineHeight:"28px",letterSpacing:"-0.01em",fontWeight:"600"}],"body-lg":["16px",{lineHeight:"26px",fontWeight:"400"}],"display-mobile":["38px",{lineHeight:"44px",letterSpacing:"-0.02em",fontWeight:"700"}],"title-lg":["18px",{lineHeight:"26px",letterSpacing:"-0.01em",fontWeight:"700"}],"headline-lg-mobile":["28px",{lineHeight:"34px",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-lg":["36px",{lineHeight:"44px",letterSpacing:"-0.02em",fontWeight:"700"}]}}}};</script></head><body class="bg-surface font-body-md text-on-surface antialiased"><main class="w-full min-h-screen bg-surface flex items-center justify-center p-4 sm:p-8"><div class="flex flex-col w-full">
<div class="relative w-full max-w-lg mx-auto my-auto flex flex-col items-center">
<!-- Subtle Background Geometric Accents -->
<div class="absolute -top-10 -left-12 w-28 h-28 bg-surface-container-high rounded-full -z-10 pointer-events-none opacity-60"></div>
<div class="absolute top-1/2 -right-16 w-32 h-32 bg-secondary-container/20 rounded-xl rotate-12 -z-10 pointer-events-none"></div>
<div class="absolute -bottom-8 -left-8 w-20 h-20 bg-primary-fixed/40 rounded-lg -rotate-6 -z-10 pointer-events-none"></div>
<div class="absolute -bottom-12 right-12 w-24 h-24 border-2 border-outline-variant/40 rounded-full border-dashed -z-10 pointer-events-none"></div>
<!-- Main Solid Card Layout -->
<div class="w-full bg-surface-container-lowest border-2 border-on-surface rounded-xl overflow-hidden shadow-[6px_6px_0px_#1e1b4b] transition-all">
<!-- Top Branding Section -->
<div class="p-6 sm:p-8 pb-6 bg-surface-container-low border-b-2 border-on-surface">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-lg bg-primary-container text-on-primary flex items-center justify-center border-2 border-on-surface shadow-[2px_2px_0px_#1e1b4b]">
<span class="material-symbols-outlined text-xl">account_balance_wallet</span>
</div>
<span class="font-display text-headline-sm uppercase tracking-tight text-on-surface">ESSARA</span>
</div>
<span class="font-label-sm text-on-surface-variant bg-surface-container px-2.5 py-1 rounded-full border border-on-surface uppercase tracking-wider">
            Audit v2.4
          </span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-1">Welcome to ESSARA</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Identify subscription leaks and duplicate software in seconds.</p>
</div>
<!-- Tab Switcher -->
<div class="grid grid-cols-2 bg-surface-container-high border-b-2 border-on-surface p-1.5 gap-1.5">
<button class="py-2.5 px-4 font-label-lg text-label-lg rounded-lg transition-all flex items-center justify-center gap-2 bg-surface-container-lowest text-on-surface border-2 border-on-surface shadow-[2px_2px_0px_#1e1b4b]" id="tab-login" onclick="switchTab('login')">
<span class="material-symbols-outlined text-base">login</span>
          Log in
        </button>
<button class="py-2.5 px-4 font-label-lg text-label-lg rounded-lg transition-all flex items-center justify-center gap-2 text-on-surface-variant hover:text-on-surface border-2 border-transparent" id="tab-signup" onclick="switchTab('signup')">
<span class="material-symbols-outlined text-base">person_add</span>
          Sign up
        </button>
</div>
<div class="p-6 sm:p-8 space-y-6">
<!-- Inline Warning / Error Validation Box -->
<div class="flex items-start gap-3 p-3.5 bg-error-container text-on-error-container border-2 border-error rounded-lg shadow-[3px_3px_0px_#93000a] transition-all" id="error-banner">
<span class="material-symbols-outlined text-error shrink-0 mt-0.5">error</span>
<div class="flex-1 min-w-0">
<p class="font-label-md text-label-md font-bold uppercase tracking-wider text-error">Validation Alert</p>
<p class="font-body-sm text-body-sm text-on-error-container mt-0.5" id="error-message">Please enter a valid work email address.</p>
</div>
<button class="text-on-error-container hover:text-error shrink-0" onclick="dismissError()" type="button">
<span class="material-symbols-outlined text-lg">close</span>
</button>
</div>
<!-- LOGIN FORM -->
<form class="space-y-5" id="form-login" novalidate="" onsubmit="handleLoginSubmit(event)">
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface block" for="login-email">
              Work Email Address
            </label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-lg placeholder:text-outline focus:outline-none focus:border-primary-container focus:shadow-[3px_3px_0px_#4338ca] transition-all" id="login-email" placeholder="name@company.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline text-xl pointer-events-none">mail</span>
</div>
</div>
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface block" for="login-password">
                Password
              </label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline" href="javascript:void(0)" onclick="triggerForgotNotice()">
                Forgot password?
              </a>
</div>
<div class="relative">
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-lg placeholder:text-outline focus:outline-none focus:border-primary-container focus:shadow-[3px_3px_0px_#4338ca] transition-all" id="login-password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-3 top-2.5 text-outline hover:text-on-surface text-xl" onclick="togglePasswordVisibility('login-password', this)" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 pt-1">
<input class="w-4 h-4 rounded border-2 border-on-surface accent-primary cursor-pointer" id="remember-device" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember-device">
              Remember this device for 30 days
            </label>
</div>
<button class="w-full py-3 px-4 bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-lg border-2 border-on-surface shadow-[4px_4px_0px_#1e1b4b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0px_#1e1b4b] active:translate-x-1 active:translate-y-1 active:shadow-[0px_0px_0px_#1e1b4b] transition-all flex items-center justify-center gap-2" type="submit">
<span>Log in</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- SIGN UP FORM -->
<form class="space-y-5 hidden" id="form-signup" novalidate="" onsubmit="handleSignupSubmit(event)">
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface block" for="signup-name">
              Full Name
            </label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-lg placeholder:text-outline focus:outline-none focus:border-primary-container focus:shadow-[3px_3px_0px_#4338ca] transition-all" id="signup-name" placeholder="Alex Chen" required="" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline text-xl pointer-events-none">badge</span>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface block" for="signup-email">
              Work Email Address
            </label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-lg placeholder:text-outline focus:outline-none focus:border-primary-container focus:shadow-[3px_3px_0px_#4338ca] transition-all" id="signup-email" placeholder="alex@company.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline text-xl pointer-events-none">mail</span>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface block" for="signup-password">
              Create Password
            </label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-lg placeholder:text-outline focus:outline-none focus:border-primary-container focus:shadow-[3px_3px_0px_#4338ca] transition-all" id="signup-password" placeholder="Minimum 8 characters" required="" type="password"/>
<button class="absolute right-3 top-2.5 text-outline hover:text-on-surface text-xl" onclick="togglePasswordVisibility('signup-password', this)" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-2 pt-1">
<input class="w-4 h-4 mt-0.5 rounded border-2 border-on-surface accent-secondary cursor-pointer" id="terms" required="" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-snug cursor-pointer select-none" for="terms">
              I agree to the <a class="text-primary-container font-semibold hover:underline" href="javascript:void(0)">Terms of Audit</a> and automated leak monitoring policies.
            </label>
</div>
<button class="w-full py-3 px-4 bg-secondary text-on-secondary font-headline-sm text-headline-sm rounded-lg border-2 border-on-surface shadow-[4px_4px_0px_#1e1b4b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0px_#1e1b4b] active:translate-x-1 active:translate-y-1 active:shadow-[0px_0px_0px_#1e1b4b] transition-all flex items-center justify-center gap-2" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-lg">bolt</span>
</button>
</form>
<!-- Structured Bottom Telemetry / Guarantee Tag -->
<div class="pt-4 border-t-2 border-surface-container-high flex items-center justify-between font-label-sm text-label-sm text-on-surface-variant">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-secondary text-base" style="font-variation-settings: 'FILL' 1;">shield</span>
<span>Zero Credential Storage</span>
</div>
<div class="flex items-center gap-1 text-on-surface">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span>SOC2 Ready Stack</span>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
  function switchTab(tab) {
    const loginTab = document.getElementById('tab-login');
    const signupTab = document.getElementById('tab-signup');
    const loginForm = document.getElementById('form-login');
    const signupForm = document.getElementById('form-signup');
    const errorBanner = document.getElementById('error-banner');

    if (tab === 'login') {
      loginTab.className = "py-2.5 px-4 font-label-lg text-label-lg rounded-lg transition-all flex items-center justify-center gap-2 bg-surface-container-lowest text-on-surface border-2 border-on-surface shadow-[2px_2px_0px_#1e1b4b]";
      signupTab.className = "py-2.5 px-4 font-label-lg text-label-lg rounded-lg transition-all flex items-center justify-center gap-2 text-on-surface-variant hover:text-on-surface border-2 border-transparent";
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
    } else {
      signupTab.className = "py-2.5 px-4 font-label-lg text-label-lg rounded-lg transition-all flex items-center justify-center gap-2 bg-surface-container-lowest text-on-surface border-2 border-on-surface shadow-[2px_2px_0px_#1e1b4b]";
      loginTab.className = "py-2.5 px-4 font-label-lg text-label-lg rounded-lg transition-all flex items-center justify-center gap-2 text-on-surface-variant hover:text-on-surface border-2 border-transparent";
      signupForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
    }
  }

  function showError(msg) {
    const errorBanner = document.getElementById('error-banner');
    const errorMessage = document.getElementById('error-message');
    errorMessage.textContent = msg;
    errorBanner.classList.remove('hidden');
  }

  function dismissError() {
    const errorBanner = document.getElementById('error-banner');
    errorBanner.classList.add('hidden');
  }

  function togglePasswordVisibility(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit(event) {
    event.preventDefault();
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-password').value;

    if (!email || !email.includes('@') || !email.includes('.')) {
      showError('Please enter a valid work email address.');
      return;
    }
    if (!pass || pass.length < 6) {
      showError('Authentication failed: Password must be at least 6 characters.');
      return;
    }
    dismissError();
    alert('Logging into ESSARA workspace for: ' + email);
  }

  function handleSignupSubmit(event) {
    event.preventDefault();
    const name = document.getElementById('signup-name').value;
    const email = document.getElementById('signup-email').value;
    const pass = document.getElementById('signup-password').value;
    const terms = document.getElementById('terms').checked;

    if (!name.trim()) {
      showError('Please provide your full legal or company name.');
      return;
    }
    if (!email || !email.includes('@') || !email.includes('.')) {
      showError('Please enter a valid work email address.');
      return;
    }
    if (!pass || pass.length < 8) {
      showError('Security requirement: Password must be at least 8 characters.');
      return;
    }
    if (!terms) {
      showError('You must agree to the Terms of Audit to proceed.');
      return;
    }
    dismissError();
    alert('Account created for ' + name + ' (' + email + ')');
  }

  function triggerForgotNotice() {
    showError('Password reset link will be sent to the entered work email address.');
  }
</script></main></body></html>
