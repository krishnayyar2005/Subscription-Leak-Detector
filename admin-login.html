<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSARA - Admin Login</title>
    <meta name="description" content="ESSARA Admin Login — Secure access to the platform administration dashboard.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <main class="auth-main">
        <div class="auth-card">

            <div class="text-center mb-8">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h1 class="font-display brand-logo" style="font-size: 40px; margin-bottom: 8px;">ESSARA</h1>
                </a>
                <p class="auth-subtitle font-body">Administration Portal</p>
            </div>

            <!-- Error Banner (Hidden by default) -->
            <div class="error-banner hidden" id="admin-error-banner">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">error</span>
                <span class="font-body" id="admin-error-message"></span>
            </div>

            <!-- Admin Login Form -->
            <form class="auth-form" id="form-admin-login">
                <div class="form-group">
                    <label class="font-label-caps" for="admin-login-email">Admin Email</label>
                    <input class="form-input font-body" id="admin-login-email" placeholder="admin@essara.com" required type="email">
                </div>
                <div class="form-group">
                    <label class="font-label-caps" for="admin-login-password">Password</label>
                    <input class="form-input font-body" id="admin-login-password" placeholder="••••••••" required type="password">
                </div>
                <button class="btn btn-primary btn-full mt-4 flex-center gap-2" type="submit" id="btn-admin-login">
                    <span class="material-symbols-outlined" style="font-size: 16px;">shield</span>
                    Admin Login
                </button>
                <p class="text-center mt-4" style="font-size: 14px; color: var(--on-surface-variant);">
                    Credentials: admin@essara.com / admin123
                </p>
            </form>

            <div class="mt-8 text-center">
                <a class="font-body text-primary hover-underline" href="login.html" style="font-size: 14px;">Back to User Login</a>
            </div>

        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
